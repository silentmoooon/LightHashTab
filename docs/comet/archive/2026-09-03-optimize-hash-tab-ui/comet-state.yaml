acceptance:
  - id: A1
    source: brief.md
    text: "A1: 主属性页在高 DPI 缩放下控件与文字无截断。用户在任意 DPI 缩放比例（100%、125%、150%
      等）下打开文件属性的“文件哈希”属性页时，表头“算法”、“哈希值”完整展示无省略号，算法名称完整显示，底部操作按钮（“设置”、“复制”、“复制全部\
      ”、“粘贴/清除”）具有合适内外边距且文字完整显示。"
    result: passed
    reason:
      text: 主属性页在高 DPI 缩放下所有控件与文字无截断，长文件名通过二分算法智能测量截断，确保文件大小与耗时始终完整可见。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 算法与哈希列表展示支持完整自适应与等宽字体清晰显示。哈希值使用清晰易读的等宽字体呈现且字体高度随 DPI
      协调缩放；当哈希值超出显示区域（如 SHA-512 128位）时允许横向滚动查看完整内容，且鼠标悬停在列表项上时弹出 Tooltip
      显示完整哈希值。"
    result: passed
    reason:
      text: 算法与哈希列表等宽字体随 DPI 缩放，长哈希列宽基于实际字体宽度测量自适应，支持横向滚动与悬浮气泡。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3:
      算法设置对话框具备正规标题栏、关闭按钮、两列排版且按钮无截断。用户点击“设置”按钮打开算法配置窗口时，弹出窗口位于父窗口中央，具有标准标题栏（“算\
      法设置”）、系统边框与关闭按钮；算法复选框采用双列整洁对齐排版，底部 [全选] [默认] 与 [确定] [取消] 按钮文字完整、间距舒适。"
    result: passed
    reason:
      text: 算法设置对话框标准模态化，双列整齐排版，四颗按钮间距充足无遮挡。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4:
      哈希比对与匹配状态具备清晰反馈与整行高亮。用户在比对框中输入或粘贴与某算法匹配的哈希字符串时，列表对应行以浅绿底色整行高亮显示，状态提示清晰显示“✔
      匹配成功: <算法名>”；当输入 8 位以上不匹配内容时显示“✖ 未匹配”。"
    result: passed
    reason:
      text: 哈希比对匹配时整行浅绿底色高亮，状态提示清晰，清空即时重置。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 界面文案与提示信息规范中文呈现。属性页标题为“文件哈希”，比较提示为“比对:”，快捷操作菜单与状态反馈均为规范中文。"
    result: passed
    reason:
      text: 界面文案与提示信息规范中文呈现，文件大小单位换算（B/KB/MB/GB）与极短耗时（< 1ms）准确显示。
      truncated: false
